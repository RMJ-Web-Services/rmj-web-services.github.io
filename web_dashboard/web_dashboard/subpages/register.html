<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../styles/login.css">
  <link rel="icon" href="../assets/RMJ_dark copy.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <div class="login-container">
    <div class="login-card">
      <h1>Welcome</h1>
      <p class="subtitle">Please sign up</p>

      <form>
        <div class="input-group">
          <label for="text">Username</label>
          <input type="text" id="email" placeholder="your_username" autocomplete="username" required>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="new-password" required>
        </div>

        <div class="input-group">
          <label for="password">Repeat password</label>
          <input type="password" id="password-repeat" placeholder="••••••••" autocomplete="new-password" required>
        </div>

        <div class="options">
          <label class="remember">
            <input type="checkbox"> Remember me
          </label>
        </div>

        <button type="submit" id="login-btn">Register</button>
      </form>

      <p class="register">Already have an account? <a href="./login.html">Log in</a></p>
    </div>
  </div>

  <script src="../scripts/register.js"></script>
</body>
</html>
