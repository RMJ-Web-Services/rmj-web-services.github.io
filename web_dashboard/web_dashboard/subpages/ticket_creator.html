<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Image Number Box Editor</title>
  <link rel="icon" href="../assets/RMJ_dark copy.svg">
  <link rel="stylesheet" href="../styles/ticket_creator.css" />
</head>
<body>

  <div id="toolbar">
    <input type="file" id="upload" accept="image/*" />
    <button id="add-number">Add Number</button>
    <button id="save">Save</button>
    <button id="close">Close</button>
  </div>

  <div id="canvas">
    <img id="image" />
    <div id="number-box">1234</div>
  </div>

  <script src="../scripts/ticket_creator.js"></script>
</body>
</html>
